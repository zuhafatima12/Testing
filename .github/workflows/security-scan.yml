name: ASVP CI/CD Security Scan

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ASVP Security Scan
        env:
          ASVP_TOKEN: ${{ secrets.ASVP_API_TOKEN }}
        run: |
          echo "Starting ASVP Scan..."
          
          if [ -z "$ASVP_TOKEN" ]; then
            echo "Error: ASVP_TOKEN is not set"
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://your-asvp-instance/api/cicd/scan" \
            -H "Authorization: Bearer $ASVP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "targetUrl": "https://juice-shop.herokuapp.com/",
              "scanProfile": "standard",
              "waitForCompletion": true,
              "failThresholds": {
                "critical": 0,
                "high": 5
              }
            }')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          echo "$BODY"
          
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error: ASVP API request failed with status $HTTP_CODE"
            exit 1
          fi
          
          # Check if scan had violations that exceed thresholds
          CRITICAL_COUNT=$(echo "$BODY" | grep -o '"critical":[0-9]*' | cut -d: -f2)
          HIGH_COUNT=$(echo "$BODY" | grep -o '"high":[0-9]*' | cut -d: -f2)
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Error: Critical vulnerabilities found: $CRITICAL_COUNT"
            exit 1
          fi
          
          if [ "$HIGH_COUNT" -gt 5 ]; then
            echo "Error: High severity vulnerabilities exceed threshold: $HIGH_COUNT > 5"
            exit 1
          fi
          
          echo "ASVP scan completed successfully"
