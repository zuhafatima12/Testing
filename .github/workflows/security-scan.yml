name: ASVP CI/CD Security Scan

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ASVP Security Scan
        run: |
          curl -X POST https://your-asvp-instance/api/cicd/scan \
          -H "Authorization: Bearer ${{ secrets.ASVP_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "targetUrl": "https://juice-shop.herokuapp.com/",
            "scanProfile": "standard",
            "waitForCompletion": true,
            "failThresholds": {
              "critical": 0,
              "high": 5
            }
          }'
